<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Cadastro de Cursos</title>
  
    
  <script>
    
    let pilhacursos = [];
	
	let indiceEdicao = null; // controla se estamos editando alguém

  function mostrarLista() {
      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = ''; // limpa o corpo da tabela

      for (let i = 0; i < pilhacursos.length; i++) {
        const curso = pilhacursos[i];
		const linha =
		  "<tr>" +
			"<td>" + i + "</td>" +
			"<td>" + curso.nome + "</td>" +
			"<td>" + curso.regime + "</td>" +
			"<td>" + curso.carga + "</td>" +
				"<div class='mt-3 d-flex gap-2'>" +
				  "<button class='btn btn-secondary' onclick='editarcurso(" + i + ")'>Editar</button>" +
				  "<button class='btn btn-danger' onclick='removercurso(" + i + ")'>Remover</button>" +
				"</div>" +
			"</td>" +
		  "</tr>";
        corpo.innerHTML += linha;
      }
    }

	
	function limpaCampos() {
	  document.getElementById('nome').value = '';
    document.getElementById('regime').value = '';
    document.getElementById('carga').value = '';
	}


    function posicao() {
      const indice = Number(
        prompt('Qual posição da lista deseja consultar?')
      );
      if (
        isNaN(indice) ||
        indice < 0 ||
        indice >= pilhacursos.length
      ) {
        alert('Posição inválida!');
        return;
      }
      const curso = pilhacursos[indice];
      alert(
        'Na posição ' + indice +
        ' está:\n\n' +
        'Nome: ' + curso.nome +
        '\nRegime: ' + curso.regime +
        '\nCarga horária: ' + curso.carga
      );
    }

    function limparLista() {
      pilhacursos = [];
      mostrarLista();
    }

    function remover() {
       const removido = pilhacursos.splice(indice, 1)[0];
      alert(
        'Curso removido:\n\n' +
        removido.nome
      );
      mostrarLista();
    }

    function inverterPilha() {
      pilhaCursos.reverse();
      mostrarLista();
    }
	
	function salvar() {
		// implementar função salvar
    const nome = document.getElementById('nome').value.trim();
    const regime = document.getElementById('regime').value.trim();
    const carga = document.getElementById('carga').value.trim();
      // Verifica se os campos estão preenchidos
      if (nome === '' || regime === '' || carga === '') {
        alert('Preencha todos os campos!');
        return;
      }
    if (indiceEdicao === null) {
      //adiconando existente
        pilhacursos.push
      ({
          nome: nome,
          regime: regime,
          carga: carga
        });
        alert('Curso cadastrado com sucesso!');
    }
    else{
      // editando existente
       pilhacursos[indiceEdicao] = {
          nome: nome,
          regime: regime,
          carga: carga // reseta o modo de edição
    };     alert('Curso atualizado com sucesso!');

        indiceEdicao = null;
      }


    // limpa formulário
      limpaCampos();
      // Atualiza tabela
      mostrarLista();
    }




   function editarCurso(indice) {
      // implementar a função editar a partir de um indice 
      const curso = pilhacursos[indice];
      // Coloca os dados do curso nos campos
      document.getElementById('nome').value = curso.nome;
      document.getElementById('regime').value = curso.regime;
      document.getElementById('carga').value = curso.carga;
      // Guarda o índice que está sendo editado
      indiceEdicao = indice; 
    }
	
	
	

	
  </script>
</head>

<body>
  <div class="container mt-5">
    <h1 class="mb-4 text-center">Cadastro de Curso</h1>
	
	
	<div class="card p-4 shadow-sm">
      <div class="row g-3">
	  
        <div class="col-md-5">
          <label class="form-label">Nome</label>
          <input type="text" id="nome" class="form-control" placeholder="Digite o nome do Curso">
        </div>

        <div class="col-md-5">
          <label class="form-label">Regime</label>
          <input type="text" id="regime" class="form-control" placeholder="selecione o Curso que Deseja">
        </div>

        <div class="col-md-5">
          <label class="form-label">Carga Horária</label>
          <input type="text" id="carga" class="form-control" placeholder="Ex: 1200">
        </div>


		
      </div>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-secondary" onclick="salvar()">Salvar</button>

      </div>
	  
    </div>
	

	
	<hr>

    <button class="btn btn-secondary" onclick="posicao()">Posição</button>
    <button class="btn btn-danger" onclick="remover()">Remover Último</button>
    <button class="btn btn-danger" onclick="limparLista()">Limpar Lista</button>
    <button class="btn btn-secondary" onclick="inverterPilha()">Inverter</button>

    <br><br>
  
  <div id="minhaDiv">
    <table class="table table-bordered table-striped align-middle shadow-sm" >
      <thead  class="table-dark">
        <tr>
          <th>#</th>
          <th>Curso</th>
          <th>Regime</th>
		   <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo">
        <!-- Linhas serão inseridas aqui -->
      </tbody>
    </table>
  </div>
  
    <hr>
  </div>
</body>
</html>
