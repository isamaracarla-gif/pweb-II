<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>JavaScript</title>
        <script type="text/javascript">
            function minhaFuncao(arg1, arg2) {
                var raiz = Math.sqrt(arg1);
                var msg = 'A Raiz Quadrada é: ';
                alert(msg + raiz);
            }
        </script>
    </head>
    <body>

        <h1>Raiz Quadrada</h1>

        <button onclick="minhaFuncao(25)">Raiz de 25 </button>
        <button onclick="minhaFuncao(36)">Raiz de 36 </button>
        <button onclick="minhaFuncao(49)">Raiz de 49 </button>
    </body>


</html>
