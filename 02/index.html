<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>JavaScript</title>
        <script type="text/javascript">
            function minhaFuncao(arg1, arg2) {
                var raiz = Math.sqrt(arg1);
                var msg = 'A Raiz Quadrada é: ';
                alert(msg + raiz);
            }
            function escreveDiv(texto){
                document.getElementById("minhaDiv").innerHTML = texto;
            }
            function escreveDiv2(texto){
                texto = prompt("Digite um texto qualquer: ");
                document.getElementById("minhaDiv2").innerHTML = texto;
            }
        </script>
    </head>
    <body>

        <h1>Raiz Quadrada</h1>

        <button onclick="minhaFuncao(25)">Raiz de 25 </button><br>
        <button onclick="minhaFuncao(36)">Raiz de 36 </button><br>
        <button onclick="minhaFuncao(49)">Raiz de 49 </button><br>

        <hr>
        <h1>Escrevendo na Div</h1>

        <button onclick="escreveDiv('<h1> Programação Web </h1>')">Escreve</button><br>
        <div id="minhaDiv"></div>

        <hr>
        <h1>Escrevendo no Texto Dinâmico</h1>
        <button onclick="escreveDiv2()">Escreve</button><br>
        <div id="minhaDiv2"></div>
    </body>


</html>
