<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>JavaScript</title>
        <script type="text/javascript">
            function minhaFuncao(arg1, arg2) {
                var raiz = Math.sqrt(arg1);
                var msg = 'A Raiz Quadrada é: ';
                alert(msg + raiz);
            }
            function escreveDiv(texto){
                document.getElementById("minhaDiv").innerHTML = texto;
            }
            function escreveDiv2(texto){
                texto = prompt("Digite um texto qualquer: ");
                document.getElementById("minhaDiv2").innerHTML = texto;
            }
            function escreveDiv3(){

                 var n = parseInt(prompt("Digite o valor de N:"));

                 if (isNaN(n) || n <= 0) {
                    alert("Por favor, insira um número válido maior que zero.");
                    return;
                }         

                
                         
                
            }


            
            function escreverNumerosInput() {
                var input = document.getElementById("numeroInput");
                var n = parseInt(input.value);
                if (isNaN(n) || n <= 0) {
                    alert("Por favor, insira um número válido maior que zero.");
                    return;
                }
                var div = document.getElementById("numerosInput");
                div.innerHTML = ""; 
                for (var i = 1; i <= n; i++) {
                    div.innerHTML += i + "<br>";
                }
            }
            function raizdeN() {
                var input = document.getElementById("numeroInput");
                var n = parseInt(input.value);
                
                }
                var div = document.getElementById("numerosInput");
                div.innerHTML = ""; 
                for (var i = 1; i <= n; i++) {
                    div.innerHTML += i + "<br>";
                }
                var raiz = Math.sqrt(n);
                div.innerHTML += "<br>A raiz quadrada de " + n + " é: " + raiz;
                var msg = 'A Raiz Quadrada é: ';
                
            }

            

        </script>
    </head>
    <body>

        <h1>Raiz Quadrada</h1>

        <button onclick="minhaFuncao(25)">Raiz de 25 </button><br><br>
        <button onclick="minhaFuncao(36)">Raiz de 36 </button><br><br>
        <button onclick="minhaFuncao(49)">Raiz de 49 </button><br>

        <hr>
        <h1>Escrevendo na Div</h1>

        <button onclick="escreveDiv('<h1> Programação Web </h1>')">Escreve</button><br>
        <div id="minhaDiv"></div>

        <hr>
        <h1>Escrevendo no Texto Dinâmico</h1>
        <button onclick="escreveDiv2()">Escreve</button><br>
        <div id="minhaDiv2"></div>

        <hr>
        <h1>Desafio</h1>
        <button onclick="escreveDiv3('número na Div 3')">Escreve números</button><br>
        <div id="minhaDiv3"></div>

        <hr>
        <h1>Desafio com Input</h1>
        <label for ="numeroInput">Digite o valor de N:</label>
        <input type="number" id="numeroInput" placeholder="Digite um número" min="1">
        <button onclick="escreverNumerosInput()">Escrever Números</button> <br><br>
        <div id="numerosInput"></div>

         <hr>
        <h1>Desafio: Raiz Quadrada de N</h1>
        <label for ="numeroInput">Digite o valor de N:</label>
        <input type="number" id="numeroInput">
        <button onclick="raizdeN()">Raiz de N</button> <br><br>
        <div id="numerosInput"></div>

    </body>


</html>
