<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Javascript</title>
        <script type="text/javascript">
            function minhaFuncao(arg1, arg2) {
                var soma = arg1 + arg2;
                var msg = 'A Soma é: ' + soma;
                alert(msg + soma);
            }
            function escreve(arg){
                document.write(arg);
            }
        </script>
    </head>
    <body>

        <h1>JavaScript</h1>
        

        <button onclick="minhaFuncao(10,20)">Clique </button>
        <button onclick="escreve('<h1>PROGRAMAÇÃO WEB</h1>')">Escreve</button>
    </body>


</html>
