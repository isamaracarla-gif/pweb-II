<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Javascript</title>
        <script type="text/javascript">
            function minhaFuncao(arg1, arg2) {
                alert(arg1 + arg2);
            }
        </script>
    </head>
    <body>

        <h1>JavaScript</h1>
        

        <button onclick="minhaFuncao(10,20)">Clique </button>
        <button onclick="minhaFuncao(true)">Clique </button>
    </body>


</html>
